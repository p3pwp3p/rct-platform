; ── 직원 배포용 config.ini 템플릿 ──
; 이 파일을 config.ini 로 복사해서 exe 옆에 두세요.
; localhost 가 아니라 "배포된 서버 주소" 를 씁니다(서버 따로 안 켜도 됨).

[rct]
; ★ 배포된 RCT 서버 주소 (예: https://rct.example.com). 끝에 / 없이.
api_url = https://여기에-배포한-서버-주소

; ★ 배포 서버의 INTERNAL_API_SECRET 과 "똑같은" 값
internal_secret = 여기에-배포서버-시크릿

strategy_url = https://secure.vantagemarkets.com/copyTrading/discover/discoverDetail?strategyId=1289377&tab=2
login_url = https://secure.vantagemarkets.com/login

; false = 크롤링/미리보기만(안전). true = 실제 정지/재활성 반영.
; 직원용은 보통 false 로 두고, 실제 적용은 관리자가 판단하는 걸 권장.
apply = false

debug_port = 9222
chrome_path = C:\Program Files\Google\Chrome\Application\chrome.exe

; exe 옆에 프로필 폴더 생성(직원 PC 사용자명과 무관하게 동작)
profile_dir = rct-sync-chrome
